<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تذكير | Islamic Reminder</title>
  <style>
    /* CSS Variables & Dark Theme Setup */
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(23, 32, 51, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --button-bg: #1e293b;
      --button-hover: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      /* Subtle dark mode radial glow background */
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      padding: 20px;
    }

    /* Main Container */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 28px;
      position: relative;
    }

    .header {
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: var(--accent-color);
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.9;
    }

    /* Reminder Text Box */
    .reminder-container {
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reminder-text {
      font-size: 1.85rem;
      line-height: 1.6;
      font-weight: 600;
      color: var(--text-main);
      transition: opacity 0.3s ease, transform 0.3s ease;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .fade-out {
      opacity: 0;
      transform: translateY(-8px);
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
    }

    /* Action Controls */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    button {
      background-color: var(--button-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background-color: var(--button-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button.primary {
      background-color: var(--accent-color);
      color: #0f172a;
      border: none;
      font-weight: 600;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    button.primary:hover {
      background-color: #7dd3fc;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="header">✦ تذكير اليوم</div>
    
    <div class="reminder-container">
      <p id="reminder" class="reminder-text">...</p>
    </div>

    <div class="actions">
      <button class="primary" onclick="getRandomReminder()">
        ذكر آخر
      </button>
      <button onclick="copyReminder()" id="copyBtn">
        نسخ
      </button>
    </div>
  </main>

  <script>
    const reminders = [
      "سبحان الله وبحمده",
      "سبحان الله العظيم",
      "لا إله إلا الله وحده لا شريك له",
      "اللهم اغفر لي وارحمني",
      "أستغفر الله العظيم",
      "اللهم صلِّ على محمد",
      "لا حول ولا قوة إلا بالله",
      "حسبي الله ونعم الوكيل",
      "اللهم اجعل هذا اليوم بركة وخيرًا",
      "اللهم إني أسألك العفو والعافية"
    ];

    const reminderEl = document.getElementById("reminder");
    let lastIndex = -1;

    function getRandomReminder() {
      // Fade out effect
      reminderEl.classList.add("fade-out");

      setTimeout(() => {
        // Avoid repeating the same reminder twice in a row
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * reminders.length);
        } while (randomIndex === lastIndex && reminders.length > 1);
        
        lastIndex = randomIndex;
        reminderEl.textContent = reminders[randomIndex];
        
        // Fade in effect
        reminderEl.classList.remove("fade-out");
        reminderEl.classList.add("fade-in");
      }, 250);
    }
 function copyReminder() {
      navigator.clipboard.writeText(reminderEl.textContent).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        const originalText = copyBtn.textContent;
        copyBtn.textContent = "تم النسخ!";
        setTimeout(() => {
          copyBtn.textContent = originalText;
        }, 1500);
      });
    }

    // Initialize with a random phrase on load
    getRandomReminder();
   
  </script>
</body>
</html>
